<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camp Legio</title>
<meta name="color-scheme" content="light">
<script>
  // Two skins share this server: Principia (the default, /principia/) and this
  // illustrated camp. ?skin=camp or the choice saved by either skin keeps you here.
  (function () {
    var skin = null;
    try {
      if (/[?&]skin=camp\b/.test(location.search)) localStorage.setItem('legio-skin', 'camp');
      skin = localStorage.getItem('legio-skin');
    } catch (e) { /* storage blocked: fall through to the default */ }
    if (skin !== 'camp' && !/[?&]skin=camp\b/.test(location.search)) location.replace('principia/');
  })();
</script>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="assets/logo.webp">
</head>
<body>
<div id="app" class="app" aria-live="polite"></div>
<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="modal-close" type="button" aria-label="Close">×</button>
    <div class="modal-body"></div>
  </div>
</div>
<script src="app.js" defer></script>
</body>
</html>
